name: DAST Security Audit Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dast-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run DAST Security Audit
        run: node scripts/run_mock_suite.js "DAST Security Audit" dast-security-report.xlsx 300

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dast-security-report
          path: dast-security-report.xlsx
