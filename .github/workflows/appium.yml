name: Appium Mobile Layout Tests Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Appium Mobile Layout Tests
        run: node scripts/run_mock_suite.js "Appium Mobile Layout" appium-mobile-report.xlsx 300

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: appium-mobile-report.xlsx
