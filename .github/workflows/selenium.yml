name: Selenium E2E Tests Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Selenium E2E Tests
        run: node scripts/run_mock_suite.js "Selenium E2E" selenium-web-report.xlsx 300

      - name: Upload Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: selenium-web-report.xlsx
